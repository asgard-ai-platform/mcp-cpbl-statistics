[project]
name = "mcp-cpbl-statistics"
version = "0.1.0"
description = "MCP server for CPBL statistics"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [
    { name = "Asgard AI Platform" },
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "fastmcp>=2.0",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "pydantic>=2.0",
]

[project.scripts]
mcp-cpbl-statistics = "mcp_cpbl_statistics.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_cpbl_statistics"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "-m 'not integration'"
markers = [
    "integration: marks tests as integration tests that make live network requests (deselect with '-m \"not integration\"')",
]
