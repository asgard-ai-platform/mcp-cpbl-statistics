[project]
name = "mcp-cpbl-statistics"
version = "0.1.0"
description = "MCP server for CPBL statistics"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=2.0",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "pydantic>=2.0",
]

[project.scripts]
mcp-cpbl-statistics = "mcp_cpbl_statistics.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_cpbl_statistics"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "-m 'not integration'"
markers = [
    "integration: marks tests as integration tests that make live network requests (deselect with '-m \"not integration\"')",
]
